name: scheduler-keepalive

on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduler-keepalive
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Record repository activity
        shell: bash
        run: |
          git config user.name "finmentor-monitor[bot]"
          git config user.email "finmentor-monitor[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled monitoring active"
          git push origin HEAD:${GITHUB_REF_NAME}
