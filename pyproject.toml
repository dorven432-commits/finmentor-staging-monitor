[project]
name = "finmentor-staging-monitor"
version = "1.0.0"
requires-python = ">=3.11"
description = "Secret-free independent reliability monitor for a staging environment"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
